[package]
name = "pose_extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pose-extract"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.16"
image = "0.25"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
