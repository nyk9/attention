[package]
name = "pose_extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pose-extract"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.16"
image = "0.25"
dialoguer = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# 動画→タグ直結パス用。認識モデルの CPU 推論ラッパー(predict_from_features)を呼ぶ。
# これ経由で Burn(wgpu 含む)も取り込まれ初回ビルドは重くなる。
transformer_burn = { path = "../transformer_burn" }
