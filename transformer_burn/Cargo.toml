[package]
name = "transformer_burn"
version = "0.1.0"
edition = "2024"

# バイナリ(学習・足場 Seq2Seq)は wgpu バックエンドが必須。
# wgpu feature 無効時(pose_extractor からの lib 取り込み等)はビルド対象外にする。
[[bin]]
name = "transformer_burn"
path = "src/main.rs"
required-features = ["wgpu"]

[dependencies]
# ndarray は CPU 推論で常用するため常時有効。
# wgpu(+autodiff)は学習専用で重いので、下記 [features] の wgpu でゲートする。
burn = { version = "0.18.0", features = ["ndarray"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
csv = "1.3"

[features]
# 既定は wgpu あり: 既存の cargo run/test/学習がそのまま動く。
# pose_extractor は default-features = false で取り込み、wgpu を外して軽量化する。
default = ["wgpu"]
wgpu = ["burn/wgpu", "burn/autodiff"]
